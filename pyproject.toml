[project]
name = "incident-response-copilot"
version = "0.1.0"
description = "Evidence-grounded, multi-agent incident investigation demo using MCP and A2A"
requires-python = ">=3.11"
dependencies = [
  "a2a-sdk[http-server]>=1.2.1,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "mcp>=2,<3",
  "pydantic>=2.8,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<2", "ruff>=0.8,<1"]
llm = ["openai>=1.50,<3"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
